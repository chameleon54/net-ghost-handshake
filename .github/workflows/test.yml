# Runs the Vitest tests (the tests/ folder) on GitHub for every push to any branch and every pull request.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # the owner's local Node major version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build